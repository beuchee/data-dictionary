name: Docker images

# Builds the two server-mode images (web: nginx + the app; api: FastAPI) on every
# push to v2 and every pull request that touches them, without pushing. On a
# version tag (v2.0.0…) it also publishes them to the GitHub Container Registry:
#   ghcr.io/<owner>/<repo>/web:<version>   ghcr.io/<owner>/<repo>/api:<version>
# See docs/deployment.md.

on:
  push:
    branches: [v2]
    tags: ["v*"]
  pull_request:
    paths:
      - docker/**
      - apps/**
      - packages/**
      - package-lock.json
      - config.json
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [web, api]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.image }}
          # web: server mode, API calls relative to the page (nginx proxies /api/).
          build-args: |
            VITE_API_URL=/
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
