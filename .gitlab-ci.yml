# GitLab CI configuration for forks deployed on GitLab Pages.
# Mirrors .github/workflows/build-and-deploy.yml: the generated data files are
# gitignored, so CI regenerates them before publishing.
#
# GitLab Pages serves whatever lands in `public/`, so the job runs build.py and
# then copies legacy/ across. The image ships Python *and* git: build.py shells out
# to git to read the concept set versions that projects pin, and exits with an
# explicit error if git is missing.
#
# To use:
#   1. In your GitLab repo, go to Settings -> Pages (it is enabled by default).
#   2. Push to the default branch — the `pages` job runs on every push.
#   3. The site is served at the URL shown under Settings -> Pages. On gitlab.com
#      that is https://<group>.gitlab.io/<project>/, but self-hosted instances
#      differ (Framagit, for one, generates a per-project subdomain), so read the
#      URL from the settings page rather than assuming it.
#
# GIT_DEPTH: 0 fetches the full history. GitLab clones shallowly by default, and
# `git show <old-sha>:concept_sets/{id}.json` fails on a commit the clone never
# fetched — so a project pinning a past version would publish without it, and
# build.py only warns. Full history costs a few seconds and avoids that.

pages:
  stage: deploy
  image: python:3.12-alpine
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git
  script:
    - python3 build.py
    - mkdir -p public
    - cp -r legacy/. public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# --- v2 ----------------------------------------------------------------------
# Builds the v2 static site (static mode) as a job artifact on the `v2` branch and
# on merge requests, without publishing it: GitLab Pages keeps serving v1 (the
# `pages` job above) until the cutover (docs/deployment.md, "Cutover").
#
# BASE_PATH comes from CI_PAGES_URL: /<project>/ on a classic <group>.gitlab.io
# URL, / on a unique domain (the default for new projects on recent GitLab).
# The node image ships python3 and git, which build.py needs.
v2-static:
  stage: build
  image: node:22-bookworm
  variables:
    GIT_DEPTH: 0
  script:
    - python3 build.py
    - npm ci
    - BASE_PATH="$(echo "${CI_PAGES_URL:-/}" | sed -E 's#^https?://[^/]+##; s#/*$#/#')"
    - echo "BASE_PATH=$BASE_PATH"
    - BASE_PATH="$BASE_PATH" npm run build:client
    - cp apps/web/dist/index.html apps/web/dist/404.html
  artifacts:
    paths:
      - apps/web/dist
    expire_in: 2 weeks
  rules:
    - if: $CI_COMMIT_BRANCH == "v2"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

