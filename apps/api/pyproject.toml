[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "data-dictionary-api"
version = "2.0.0.dev0"
license = "EUPL-1.2"
description = "INDICATE Data Dictionary v2 backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "greenlet>=3.0",  # required by SQLAlchemy async on this platform/python
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "cryptography>=42",
    "python-multipart>=0.0.9",
    "structlog>=24.0",
    # The OMOP vocabulary engine: ATHENA import to Parquet, concept queries, resolution.
    "duckdb>=1.1",
    # Forge APIs (pull / merge requests) and OAuth token exchanges.
    "httpx>=0.27",
    # Mapping import: XLSX files (services/mapping_import).
    "openpyxl>=3.1",
    # The content-file contract (parse, validate, byte-exact serialize), shared
    # with the TS side. A path source in dev; the Docker image installs it first.
    "dictionary-format",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.5",
]
postgres = [
    "asyncpg>=0.30",
]

[tool.uv.sources]
dictionary-format = { path = "../../packages/dictionary-format/python", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions", "tests/fixtures/reference_scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults is the framework idiom

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-local-folder = ["conftest", "content_fixtures", "vocab_fixtures", "git_fixtures"]
