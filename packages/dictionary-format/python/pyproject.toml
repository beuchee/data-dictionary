[project]
name = "dictionary-format"
version = "0.1.0"
description = "Schemas, byte-exact serializer and validator for INDICATE Data Dictionary content files"
license = "EUPL-1.2"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.18"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dictionary_format"]

# Ship the shared schemas inside the wheel. In an editable install / the repo,
# schemas.py finds them in ../schemas instead.
[tool.hatch.build.targets.wheel.force-include]
"../schemas" = "dictionary_format/schemas"
"../fixtures" = "dictionary_format/fixtures"

[tool.pytest.ini_options]
testpaths = ["tests"]
